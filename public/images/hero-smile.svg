<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6f3f0"/>
      <stop offset="1" stop-color="#cfe9e3"/>
    </linearGradient>
    <linearGradient id="chair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d7ece9"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- soft decorative circles -->
  <circle cx="90" cy="500" r="120" fill="#b2dbd4" opacity="0.4"/>
  <circle cx="730" cy="80" r="90" fill="#5aa89c" opacity="0.15"/>

  <!-- dental chair / patient scene (friendly, abstract) -->
  <g transform="translate(140,120)">
    <!-- chair back -->
    <rect x="40" y="40" width="300" height="300" rx="36" fill="url(#chair)" stroke="#9fd0c7" stroke-width="2"/>
    <!-- headrest -->
    <circle cx="190" cy="110" r="70" fill="#f3ded0"/>
    <!-- face -->
    <circle cx="190" cy="110" r="70" fill="none"/>
    <circle cx="165" cy="100" r="6" fill="#2f7067"/>
    <circle cx="215" cy="100" r="6" fill="#2f7067"/>
    <path d="M160 135 Q190 155 220 135" stroke="#2f7067" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- body -->
    <path d="M90 300 Q190 240 290 300 L290 360 Q190 400 90 360 Z" fill="#5aa89c"/>
    <!-- bib -->
    <path d="M140 230 Q190 260 240 230 L235 270 Q190 290 145 270 Z" fill="#ffffff" stroke="#9fd0c7" stroke-width="2"/>
  </g>

  <!-- dentist tool accent -->
  <g transform="translate(470,160)">
    <circle cx="90" cy="90" r="90" fill="#ffffff" opacity="0.6"/>
    <path d="M60 50 q30-20 60 0 l-10 70 q-5 20 -20 20 q-15 0 -20 -20 Z" fill="#5aa89c"/>
    <circle cx="90" cy="48" r="10" fill="#2f7067"/>
  </g>

  <!-- sparkle accents for "clean/fresh" feeling -->
  <g fill="#2f7067" opacity="0.6">
    <path d="M620 340 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6 Z"/>
    <path d="M110 90 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 Z"/>
  </g>
</svg>
